# config/task_types.yaml
#
# ЗАКРЫТЫЙ список типов задач (фаза 1, блок 4; план п. 8.2).
# Типа, которого здесь нет, не существует: контракт отвергнет задачу с
# незнакомым типом, назвав список существующих.
#
# ПОЧЕМУ ЗДЕСЬ ОДНА ЗАПИСЬ, А НЕ ДЕСЯТЬ
# Список закрытый — значит в нём лежит только то, что можно обосновать
# СЕГОДНЯ. Приёмка фазы 2 — «одна фоновая задача от начала до конца», и это
# разбор папки. Остальное появится тогда, когда появится тот, кто это делает.
# Добавить тип — это ОДНА запись здесь и ни одной правки в core/ или agent/;
# именно это и проверяет требование универсальности.
#
# ЧТО ОБЯЗАН ИМЕТЬ КАЖДЫЙ ТИП
#   acceptance — хотя бы один способ доказать, что работа сделана. Тип без
#                способа приёмки — это задача, которая не может отчитаться;
#                держит test_task_type_has_acceptance (имя из плана).
#                Способы — из закрытого списка agent/contracts.CHECK_KIND, и
#                каждый отвечает «да/нет/неизвестно» БЕЗ вызова модели (I43).
#   agent_role — РОЛЬ исполнителя, не имя (I21). Что роли разрешено — это
#                другой файл (agents.yaml, фаза 2): здесь «какая работа»,
#                там «кому можно». Двух списков одного и того же нет.
#   limits     — потолки на одну задачу. Числа из 13.7.17: обычная задача
#                агента ≤ 8 вызовов модели. Владелец правит их здесь сам,
#                не залезая в код.
#
# Правило файла: только ДОБАВЛЯТЬ. Удалить тип, задачи которого лежат в
# базе, — значит сделать их нечитаемыми (то же правило, что у схемы Д36).

types:

  free_goal:
    # «Разбери загрузки», «найди и сохрани отчёт» — свободная цель, которую
    # владелец говорит голосом через инструмент agent_task.
    #
    # ПОЧЕМУ ЭТОТ ТИП ЕСТЬ, ХОТЯ СПИСОК ЗАКРЫТЫЙ. Правило файла — «только то,
    # что можно обосновать СЕГОДНЯ». Обоснование самое сильное из возможных:
    # этот путь РАБОТАЕТ ПРЯМО СЕЙЧАС. Инструмент agent_task объявлен модели,
    # дверь безопасности его пропускает, и владелец может позвать его голосом
    # (проверено замером 19.08.2026). Блок 8 не заводит новую возможность —
    # он даёт уже существующей память, которая переживает перезапуск.
    #
    # ПОЧЕМУ ЭТО НЕ «ТИП НА ВСЁ». Он ограничен ровно тем, что умеет монолит:
    # многошаговая цель, которую разбирает планировщик. Как появятся узкие
    # типы (разбор папки, поиск с сохранением), они заберут своё, а этот
    # останется только для того, что ни в один узкий не попало.
    title: свободная цель
    agent_role: main
    acceptance:
      - no_error      # ни один шаг не упал. Единственное, что можно проверить
                      # у свободной цели БЕЗ вызова модели (I43): чего именно
                      # владелец хотел, заранее не знает никто.
    limits:
      max_llm_calls: 8
      max_seconds: 900
      bucket: task

  file_sort:
    # «Разбери загрузки, чтобы pdf лежали отдельно».
    title: разобрать папку
    agent_role: file_clerk
    acceptance:
      - ext_is        # файлы нужного расширения лежат в нужной папке
      - count_ge      # их не меньше, чем было обещано
      - no_error      # ни один шаг не упал
    limits:
      max_llm_calls: 8
      max_seconds: 900
      bucket: task
