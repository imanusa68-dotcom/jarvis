# Реестр «роль → модель» (этап 0.6 миграции MARK XXXVI).
#
# ЕДИНСТВЕННОЕ место в проекте, где встречаются имена моделей (grep-гейт).
# Смена модели = правка одной строки здесь. Фаза 0.5 (2026-08-06):
# роли разведены на модели поколения 3.5 ради дневных лимитов;
# имена сверены с живым списком API через tools/list_models.py.
#
# ВАЖНО про квоты (проверено по коду 2026-08-08, не догадка):
# остывание после 429 считается по ИМЕНИ МОДЕЛИ (core/model_guard.py,
# ключ _key(model)), а НЕ по имени роли. Значит роли, сидящие на одной
# модели, делят и дневной лимит, и остывание: сегодня это aux_light,
# live_screen и vision — все три на gemini-3.5-flash-lite. Изоляция есть только
# между РАЗНЫМИ моделями (aux_light ↔ aux_heavy ↔ aux_cheap).
# Пересаживать vision на свою модель — только по живым замерам времени
# ответа (строка «[ComputerControl] зрение: ...» в консоли), а не на всякий случай.
# Не схлопывать роли без анализа квот: роль — это точка правки,
# даже когда модель за ней та же самая.
#
# Будущие роли: embedder — отложен в фазу 1 (сегодня память лежит в JSON
# и ищется текстом, роль была бы мёртвой строкой), memory-extractor,
# classifier — с fallback-цепочками и capability-валидацией (registry v2).

roles:
  # Главная голосовая live-сессия (main.py; AUDIO, voice Charon, tools)
  live_voice: models/gemini-2.5-flash-native-audio-preview-12-2025

  # Screen View live (screen_live_session/runtime). ВНИМАНИЕ (2026-07):
  # Live API отключил TEXT-модальность у всех live-моделей (close 1007) —
  # runtime отключён, анализ экрана идёт REST-путём (роль aux_light).
  # Роль сохранена для ревизии на этапе 5 (VoiceSession).
  live_screen: models/gemini-3.1-flash-live-preview

  # Лёгкие/вспомогательные batch-вызовы: aux_call default, планировщик
  # (create_plan), анализ ошибок, детект языка, синтез web_search/deep_research,
  # vision-анализ кадра Screen View
  aux_light: gemini-3.5-flash-lite

  # Тяжёлые batch-вызовы: replan, перевод результатов, объяснение кода
  # и генератор починки шага (agent/error_handler.generate_fix — пишет код,
  # поэтому самая умная из доступных ролей)
  aux_heavy: gemini-3.5-flash

  # Vision-локация UI-элементов на экране: computer_control,
  # _analyze_screen_for_element → core/aux_model.aux_call, caller="Vision".
  # Модель та же, что у aux_light, значит дневной лимит и остывание
  # у них общие — см. шапку файла. Смена здесь меняет только зрение.
  vision: gemini-3.5-flash-lite

  # Самая дешёвая роль: короткие технические вопросы, где ответ — одно слово.
  # Единственный клиент сейчас — различение латинских языков
  # (agent/executor.py::_detect_language). Кириллицу, арабицу и иероглифы
  # определяет чистый код (core/search_locale.py) — без сети и без квоты,
  # сюда попадает только латиница. У Gemma отдельный дневной счётчик,
  # поэтому такие мелочи не тратят лимит моделей 3.5.
  aux_cheap: gemma-4-26b-a4b-it

# Пределы ролей.
#
# Предел принадлежит модели, а не владельцу: он меняется той же строкой, что и
# сама модель, поэтому живёт здесь, а не в ~/.jarvis/settings.json — иначе смена
# модели молча оставила бы предел от прежней.
#
# max_input_chars — сколько знаков уходит в запрос. Лишнее срезается ДО
# отправки (core/aux_model.py::cheap_call): лимит на объём текста в минуту даёт
# ошибку запроса, а не задержку, и ловить его после отправки поздно.
limits:
  aux_cheap:
    max_input_chars: 12000

  # Повтор при временном отказе поставщика (шаг 3-бис).
  # 503 UNAVAILABLE — это «модель сейчас перегружена», а не «квота кончилась»:
  # он проходит сам за секунды. Ночь 2026-08-07 показала: один заход из
  # шести упал именно так. attempts — всего заходов, считая первый.
  # На 429 повтора нет никогда: там работает остывание core/model_guard.py.
  retry:
    attempts: 2
    pause_seconds: 1.7

  # Срок ожидания одного запроса к поставщику (шаг Б, 10.08.2026).
  #
  # Без срока запрос висит, пока сеть не оборвётся сама: владелец слышит
  # тишину и не понимает, думает Джарвис или умер. Это потолок ожидания,
  # а не ускорение — обычный ответ приходит на порядок раньше.
  #
  # provider — это имя ПОСТАВЩИКА, а не роли модели: в разделе roles его нет
  # и быть не должно. Предел принадлежит поставщику и меняется одной строкой
  # здесь, рядом с именами моделей, а не в ~/.jarvis/settings.json.
  #
  # Убрать строку целиком = вернуть прежнее поведение (ждать без срока).
  # Живого ключа этот срок ещё не видел; держит ли его сам SDK для обычного
  # (не потокового) запроса — вопрос к версии SDK, а не к нашему коду.
  provider:
    timeout_seconds: 60
    # Куда стучится дешёвая проверка связи перед тем, как поднимать сессию.
    # Адрес живёт здесь, а не в коде: знание о поставщике хранится в реестре.
    # Уберёте три строки ниже — проверка ответит «не знаю», и Джарвис
    # будет пробовать подключаться так же, как до этого шага.
    probe_host: generativelanguage.googleapis.com
    probe_port: 443
    probe_timeout_seconds: 1.5
