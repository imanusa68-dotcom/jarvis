# config/languages.yaml
# MARK XXXVI — таблицы для определения языка без сети и без модели.
#
# Зачем файл существует:
#   Письменность (кириллица, иероглифы, вязь) видна по самим буквам — её узнаёт
#   код без всяких таблиц. А вот все европейские языки пользуются одной и той же
#   латиницей, и различить их можно только по частым словам и своеобразным
#   буквам. Раньше этот вопрос уходил по сети к модели; теперь ответ здесь.
#
# Новый язык добавляется ПРАВКОЙ ЭТОГО ФАЙЛА и ни одной строчки в core/.
# Код языка обязан существовать в таблице локалей core/search_locale.py,
# иначе поиск получит английскую локаль молча (сторож это проверяет).
#
# Как сравниваются слова:
#   С текста и со слов из этого файла снимаются все значки над буквами,
#   поэтому владелец может писать "cok guzel" вместо "çok güzel" — совпадёт.
#   Записывать слово дважды (со значками и без) НЕ НУЖНО.
#
# Все слова в кавычках нарочно: без них YAML превратит испанское no
# в логическое «нет», а итальянское "on" — в «включено».

version: 1

# Что отвечать, когда узнать не удалось.
# Решение владельца от 7 августа 2026: владелец говорит по-русски, значит
# непонятный ввод считается русским, а не английским.
fallback: "ru"

# Единственное исключение — ради поиска.
# Если язык не узнан, но в тексте одна латиница ("RTX 5060 review"), отвечаем
# английским: этот ответ уходит в локаль поиска, а русская локаль на английском
# запросе вернёт мусор. Кириллица, цифры и знаки латиницей не считаются —
# они получают русский из fallback выше.
fallback_latin: "en"

thresholds:
  # Какая доля букв одной письменности считается перевесом.
  # 0.15 — ровно то число, что работало до сегодня. Не менять без замера.
  script_share: 0.15
  # Сколько украинских букв отделяют украинский от русского.
  ukrainian_share: 0.05
  # Сколько узнанных слов нужно, чтобы поверить словам.
  # Два, а не одно: единственное случайное совпадение (нем. war = англ. war)
  # не должно уводить весь ответ в чужой язык.
  word_min_hits: 2
  # Сколько первых знаков текста смотреть. Длиннее — медленнее без толку.
  sample_chars: 500

# Языки на латинице. Порядок значения не имеет.
# words   — частые короткие слова (союзы, местоимения, глаголы-связки).
# letters — буквы, которые почти не встречаются в других языках списка.
#           Заглавные указаны отдельно там, где они себя ведут особенно
#           (турецкая İ при понижении регистра распадается на два знака).
latin:

  en:
    words: ["the", "and", "is", "are", "was", "were", "you", "your", "this", "that",
            "with", "for", "from", "what", "when", "where", "how", "why", "not",
            "have", "has", "will", "would", "can", "could", "should", "they", "them",
            "but", "all", "about", "there", "their", "please", "thanks", "hello",
            "does", "did", "been", "more", "than", "then", "some", "into", "which"]
    letters: ""

  de:
